name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform: [ AnyCPU, x86, x64 ]

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Show environment
        shell: pwsh
        run: |
          dotnet --info
          Write-Host "matrix platform: ${{ matrix.platform }}"

      # The .NET SDK infers a RuntimeIdentifier (win-x86 / win-x64) from PlatformTarget for
      # .NET Framework executables, and the assets file must be restored with the same
      # properties that the build uses. Restoring the solution once and then building with
      # -p:Platform=x64 fails with NETSDK1047, so every platform restores explicitly.
      - name: Restore (Any CPU)
        if: matrix.platform == 'AnyCPU'
        shell: pwsh
        run: dotnet restore ILXP.slnx

      - name: Restore (x86 / x64)
        if: matrix.platform != 'AnyCPU'
        shell: pwsh
        run: |
          dotnet restore src/ILXP/ILXP.csproj -p:Platform=${{ matrix.platform }}
          dotnet restore tests/ILXP.Tests/ILXP.Tests.csproj -p:Platform=${{ matrix.platform }}

      - name: Build (Any CPU)
        if: matrix.platform == 'AnyCPU'
        shell: pwsh
        run: dotnet build ILXP.slnx -c Release --no-restore

      - name: Build (x86 / x64)
        if: matrix.platform != 'AnyCPU'
        shell: pwsh
        run: |
          dotnet build src/ILXP/ILXP.csproj -c Release --no-restore -p:Platform=${{ matrix.platform }}
          dotnet build tests/ILXP.Tests/ILXP.Tests.csproj -c Release --no-restore -p:Platform=${{ matrix.platform }}

      - name: Verify PE platform
        shell: pwsh
        run: |
          $exe = if ('${{ matrix.platform }}' -eq 'AnyCPU') {
            "src/ILXP/bin/Release/net40/ILXP.exe"
          } else {
            "src/ILXP/bin/${{ matrix.platform }}/Release/net40/ILXP.exe"
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/Test-Platform.ps1 `
            -Exe $exe -Expected "${{ matrix.platform }}"
          if ($LASTEXITCODE -ne 0) { throw "platform verification failed" }

      - name: Test suite
        if: matrix.platform == 'AnyCPU'
        shell: pwsh
        run: |
          $exe = "tests/ILXP.Tests/bin/Release/net40/ILXP.Tests.exe"
          & $exe run --ilxp "src/ILXP/bin/Release/net40/ILXP.exe"
          if ($LASTEXITCODE -ne 0) { throw "test suite failed with exit code $LASTEXITCODE" }

      - name: CLI smoke test
        if: matrix.platform == 'AnyCPU'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/Smoke-Test.ps1 `
            -Exe "src/ILXP/bin/Release/net40/ILXP.exe"
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed with exit code $LASTEXITCODE" }

      - name: Decompile accuracy report
        if: matrix.platform == 'AnyCPU'
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = "src/ILXP/bin/Release/net40/ILXP.exe"
          & $exe --accuracy $exe --language il
          & $exe --accuracy $exe --language cs
          & $exe --accuracy $exe --language vb

      - name: Render screenshot
        if: matrix.platform == 'AnyCPU'
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = "src/ILXP/bin/Release/net40/ILXP.exe"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & $exe --screenshot artifacts/screenshot-main.png --window main --open $exe --select ILXP.CodeEditor

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ILXP-${{ matrix.platform }}
          path: |
            src/ILXP/bin/**/Release/net40/**
            tests/ILXP.Tests/bin/**/Release/net40/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload screenshot
        if: matrix.platform == 'AnyCPU'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 30
